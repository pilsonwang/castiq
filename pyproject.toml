[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "castiq"
version = "1.0.0"
description = "RevOps analytics stack for an industrial die-cast supplier: market sizing, ICP scoring, territories, lead scoring, pipeline health, win/loss, and forecasting on public Hugging Face data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.1",
  "huggingface_hub>=0.25",
  "jinja2>=3.1",
  "numpy>=1.26",
  "pandas>=2.2",
  "plotly>=5.24",
  "pyarrow>=16",
  "pyyaml>=6",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["mypy>=1.11", "pandas-stubs", "pytest>=8", "pytest-cov>=5", "ruff>=0.6", "types-PyYAML"]

[project.scripts]
castiq = "castiq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
castiq = ["sql/*.sql", "templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: test downloads real data from Hugging Face (skipped unless CASTIQ_NETWORK_TESTS=1)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = ["N803", "N806", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# docs.py is mostly Markdown prose inside f-strings; wrapping it would change the generated documents.
"src/castiq/docs.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
files = ["src/castiq"]
