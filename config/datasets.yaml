# Every dataset is pinned to an exact Hugging Face commit, so each run gives the same numbers.
# To move to a newer version: change `revision`, run `castiq run-all`, and look at the diff in docs/metrics.json.

crm:
  # Relational B2B CRM: accounts, contacts, leads, opportunities, activities, web sessions, touches.
  # SYNTHETIC (generated by the open-source `leadforge` simulator). MIT license.
  repo_id: shaypal5/leadforge-lead-scoring-v1
  revision: 0bf5ea25697de87e37e39898e4281fd90d98ac9a
  # Main tier for the demo. "intermediate" = 8% missing values, medium noise - close to a well-run CRM.
  # ("advanced" has 18% missing values and heavy noise; all tiers are benchmarked in the report.)
  tier: intermediate
  benchmark_tiers: [intro, intermediate, advanced]
  tables: [accounts, contacts, leads, opportunities, sales_activities, sessions, touches]
  task: converted_within_90_days
  snapshot_day: 30        # the source exports each lead's events up to day 30 after lead creation
  splits: {train: train, valid: valid, test: test}

deals:
  # REAL B2B deals from a Slovenian IT solutions company (Salvirt), anonymised. 448 won/lost deals
  # with RFI / RFP / formal-tender flags - the same buying motion as an industrial RFQ. CC-BY-4.0.
  repo_id: markobo/B2B_Sales_data
  revision: c3bae20f010d8ec74f6e9f85ef19368811dd15d3
  file: Salvirt_B2B_ML_dataset_HF.csv
  sep: ";"

companies:
  # REAL firmographics: 17M+ companies (LinkedIn-style industry, size band, HQ city/state). ODC-BY.
  # We keep US companies only; the raw file is 629 MB gzip and is cached under data/hf_cache.
  repo_id: bigpictureio/companies-2023-q4-sm
  revision: 19f3f14210e05d9e2be1b6e00fbb50c9317c1414
  file: companies-2023-q4-sm.csv.gz
  country_code: US
